name: Release plugin ZIP

# Publishes every platform artifact as GitHub Release assets when a v* tag is pushed.
#
# This file used to live at wordpress/tackquote/.github/workflows/ (then named
# tackquote-for-woocommerce/),
# where GitHub never read it — workflows are only picked up from the repository
# ROOT .github/workflows/. That is why no release asset was ever built by CI: the
# v1.1.0 tag triggered nothing and every zip was uploaded by hand. The Magento
# asset shows what hand-building costs — the published v1.1.0 zip had a
# `magento2/` top-level directory instead of `Vendor/Module/`, so Magento could
# never discover the module, and it contained eight files that exist nowhere in
# this repository's history.
#
# It also uploaded `dist/tack-quotes.zip` by name while build.sh emitted a
# slug-named zip, so the upload step would have failed on a missing file even if
# the workflow had been read. It now uploads `dist/*.zip` from
# scripts/package-all.sh, which is immune to the slug moving -- as it just did,
# to `tackquote.zip`.
#
# This repo is public, so Actions minutes are free, and this workflow DOES run —
# confirmed on the v1.7.1 tag (run 34026867487, 2026-09-06): it built all ten
# platform artifacts via scripts/package-all.sh and uploaded them as release
# assets automatically, with no hand-built zip involved. (An earlier version of
# this comment claimed Actions was billing-blocked on this account and told
# people to cut releases locally instead — that claim was never re-checked
# after it stopped being true, and manual release-building is exactly the
# failure mode the first half of this comment describes. Don't restore it.)
#
# To cut a release: push a `v*` tag to this repository. That's the whole
# process — this workflow does the rest. See README.md "Cutting a release" for
# the full walkthrough, including what to check if a platform artifact looks
# wrong after the run.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP
        run: |
          find . -path ./dist -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Build every platform artifact
        run: bash scripts/package-all.sh dist

      - name: Attach ZIPs to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
